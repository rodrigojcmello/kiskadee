<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1072" viewBox="0 0 1440 1072" fill="#182638" role="img" aria-labelledby="title description">
  

  <title id="title">Open Select and shared Dropdown ownership</title>
  

  <desc id="description">An open Select showing the separate Select schema root and the portalled Headless Select Content. Dropdown e1 paints the floating surface, e2 paints each option, e4 paints option labels, and e10 paints the selected checkmark. Headless Select retains selection, active candidate, keyboard, ARIA and positioning ownership.</desc>
  

  <style>
text { font-family: Inter, &quot;Segoe UI&quot;, Arial, sans-serif; }
.title { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
.eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 2px; fill: #5d7087; }
.subtitle { font-size: 20px; fill: #52657b; }
.call { font-size: 22px; font-weight: 700; }
.detail { font-size: 18px; fill: #52657b; }
.body { font-size: 24px; }
.small { font-size: 17px; fill: #52657b; }
.note { font-size: 19px; }
.slot { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
</style>
  

  <rect x="0" y="0" width="1440" height="1072" rx="0" fill="#f7f9fc" stroke="none"/>
  

  <text x="52" y="48" class="eyebrow">02 / SELECT COMPOSITION</text>
  <text x="52" y="94" class="title">The list reuses Dropdown presentation</text>
  <text x="52" y="128" class="subtitle">Current open Select / real selection / the Select and Dropdown have independent schema namespaces</text>
  <rect x="66" y="176" width="734" height="215" rx="14" fill="#ffffff" stroke="#315a83" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="86" y="207" class="slot" fill="#315a83">SELECT SCHEMA / e1</text>
  <text x="86" y="242" class="body">Workspace</text>
  <rect x="86" y="258" width="694" height="76" rx="7" fill="#fafafa" stroke="#d9dde3" stroke-width="2"/>
  <text x="116" y="306" class="body">Frontend engineering</text>
