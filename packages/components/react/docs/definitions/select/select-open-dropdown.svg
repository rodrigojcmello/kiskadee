  <path d="M87 333 H779" fill="none" stroke="#0067b9" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
  <text x="86" y="365" class="note" fill="#677282">Choose a workspace.</text>
  <rect x="66" y="410" width="734" height="393" rx="14" fill="none" stroke="#70849a" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="86" y="432" class="slot" fill="#70849a">HEADLESS SELECT CONTENT / PORTALLED LISTBOX</text>
  <rect x="93" y="451" width="694" height="335" rx="9" fill="#e3e7ed" stroke="none"/>
  <rect x="86" y="445" width="694" height="335" rx="9" fill="#ffffff" stroke="#dce1e8" stroke-width="1.5"/>
  <rect x="94" y="616" width="678" height="78" rx="6" fill="#f1f1f1" stroke="none"/>
  <text x="150" y="496" class="body">Design systems</text>
  <text x="150" y="574" class="body" fill="#8d949d">Archived workspace</text>
  <text x="150" y="653" class="body">Frontend engineering</text>
  <text x="150" y="733" class="body">Research and accessibility</text>
  <path d="M111 648 L123 660 L143 638" fill="none" stroke="#242424" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
  <path d="M800 207 H906 V212 H932" fill="none" stroke="#315a83" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="800" cy="207" r="4" fill="#315a83" stroke="#ffffff" stroke-width="2"/>
  <path d="M780 280 H900 V321 H932" fill="none" stroke="#315a83" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
