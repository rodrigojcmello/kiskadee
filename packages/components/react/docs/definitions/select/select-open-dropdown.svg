  <text x="950" y="204" class="call" fill="#315a83">Select e1 / Root</text>
  <text x="950" y="231" class="detail">Owns the field composition</text>
  <text x="950" y="311" class="call" fill="#315a83">Select e4 / Trigger</text>
  <text x="950" y="338" class="detail">Contains e5 value and e6 chevron</text>
  <text x="950" y="438" class="call" fill="#ad681e">Dropdown e1 / Surface</text>
  <text x="950" y="465" class="detail">Own fill, border, radius and effects</text>
  <text x="950" y="549" class="call" fill="#ad681e">Dropdown e2 / Item</text>
  <text x="950" y="576" class="detail">Own background + interaction states</text>
  <text x="950" y="670" class="call" fill="#ad681e">Dropdown e4 / Label</text>
  <text x="950" y="697" class="detail">Own text palette and typography</text>
  <text x="86" y="873" class="call" fill="#ad681e">Dropdown e10 / Checkmark</text>
  <text x="86" y="900" class="detail">Decoration showing the confirmed option</text>
  <rect x="932" y="752" width="456" height="128" rx="12" fill="#ffffff" stroke="#dce3eb"/>
  <text x="952" y="780" class="call">Headless Select owns</text>
  <text x="952" y="811" class="note">Selection, candidate, keyboard, ARIA</text>
  <text x="952" y="838" class="note">and anchored positioning.</text>
  <text x="952" y="863" class="small">Select e13 supplies gap and clearance.</text>
  <rect x="52" y="937" width="1336" height="98" rx="12" fill="#eaf0f7" stroke="none"/>
  <text x="76" y="968" class="call">State bridge</text>
  <text x="76" y="1002" class="note">Confirmed choice -&gt; selected + checkmark. Highlighted candidate -&gt; hovered. These states are independent.</text>
  

</svg>
