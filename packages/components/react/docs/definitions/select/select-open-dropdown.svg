  <circle cx="772" cy="623" r="4" fill="#ad681e" stroke="#ffffff" stroke-width="2"/>
  <path d="M460 650 H824 V683 H932" fill="none" stroke="#ad681e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="460" cy="650" r="4" fill="#ad681e" stroke="#ffffff" stroke-width="2"/>
  <path d="M124 667 V830 H202 V846" fill="none" stroke="#ad681e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
