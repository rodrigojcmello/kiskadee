<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" fill="#182638" role="img" aria-labelledby="title description">
  

  <title id="title">Select control anatomy</title>
  

  <desc id="description">Annotated sequential Select with e1 root, e2 label, e3 common control surface, e4 trigger, e5 value, e6 chevron, e7 bottom indicator, e8 Previous, e9 Next, e10 message, e11 alternate placeholder and two occurrences of e12 divider.</desc>
  

